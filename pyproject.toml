[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "app"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [{ name = "Nicolas Molina Monroy", email = "hi@nicobytes.com" }]

# La raíz importable es app/: el código usa imports planos
# (from agents.x import ..., from transcript.y import ...), igual que al
# ejecutar `cd app && python main.py`.
[tool.setuptools]
package-dir = { "" = "app" }
py-modules = ["main", "settings"]

[tool.setuptools.packages.find]
where = ["app"]
include = ["agents*", "transcript*"]
exclude = ["data*", "input*"]
namespaces = true

[tool.ruff]
line-length = 88
exclude = [
    "app/data",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
